name: Bug report
description: Report a reproducible defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for product or code defects. Do not disclose security vulnerabilities here; see the security policy.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What broke?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide a minimal, deterministic reproduction.
      placeholder: |
        1. Install ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: package version, tag or commit sha
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js version, operating system, browser, deployment mode, anything else relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      render: shell
